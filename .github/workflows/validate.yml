name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Not submitted to the default catalog; added to the Marketplace by link.
          ignore: brands topics description

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # pytest-homeassistant-custom-component pins the matching Home Assistant
      # release; the HA container's newer stable release does not fit it.
      - name: Install test dependencies
        run: |
          pip install pytest-homeassistant-custom-component
          pip install -r requirements_test.txt
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
