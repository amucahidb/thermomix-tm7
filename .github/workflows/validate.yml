name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Not submitted to the default catalog; added to the Marketplace by link.
          ignore: brands topics description

  tests:
    name: Tests
    runs-on: ubuntu-latest
    container: ghcr.io/home-assistant/home-assistant:stable
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          pip install --root-user-action=ignore --no-deps pytest-homeassistant-custom-component
          pip install --root-user-action=ignore -r requirements_test.txt
      - name: Run tests
        # Another installed plugin imports httpx before the HA test plugin can
        # alias it, so load the plugins explicitly, the HA one first.
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q -p no:cacheprovider
          -p pytest_homeassistant_custom_component.plugins
          -p pytest_asyncio.plugin -p pytest_freezer -p pytest_socket
          -p syrupy -p pytest_timeout
